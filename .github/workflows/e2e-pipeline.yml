name: HRMS End-to-End Automation Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Backend Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Build Backend
        run: dotnet build backend/src/IndiaHRMS.API/IndiaHRMS.API.csproj --configuration Release

  test:
    name: API Integration Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: Password123!
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Password123! -Q 'SELECT 1' -No"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Root Node Dependencies (Playwright)
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Install Frontend Dependencies
        run: npm ci --prefix dHRMS_2.0frontend

      - name: Start Backend API Server
        env:
          ASPNETCORE_ENVIRONMENT: CI
        run: |
          dotnet run --project backend/src/IndiaHRMS.API/IndiaHRMS.API.csproj \
            --urls=http://localhost:5110 \
            --configuration Release &
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5110/health 2>/dev/null; then
              echo "Backend is ready."
              break
            fi
            echo "Attempt $i: backend not ready yet..."
            sleep 3
          done

      - name: Run API Playwright Tests
        run: npx playwright test --project=api --reporter=list

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
